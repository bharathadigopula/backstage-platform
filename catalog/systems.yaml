#==============================================================================
# INTERNAL DEVELOPER PLATFORM DOMAIN
#==============================================================================

apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: internal-developer-platform
  title: Internal Developer Platform
spec:
  owner: group:default/platform-engineering
---
#==============================================================================
# PLATFORM AUTOMATION SYSTEM
#==============================================================================

apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: platform-automation
  title: Platform Automation
spec:
  owner: group:default/platform-engineering
  domain: internal-developer-platform
---
#==============================================================================
# BACKSTAGE PLATFORM COMPONENT
#==============================================================================

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-platform
  title: BharathCoudOps Developer Portal
  annotations:
    github.com/project-slug: bharathadigopula/backstage-platform
    jenkins.io/job-full-name: platform:backstage-platform/validate/main
spec:
  type: website
  lifecycle: production
  owner: group:default/platform-engineering
  system: platform-automation
---
#==============================================================================
# JENKINS CONTROLLER AUTOMATION COMPONENT
